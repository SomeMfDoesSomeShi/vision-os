
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VISION OS - Sound Vision</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050c14;color:#e4faff;
 font-family:Arial,sans-serif
}
header{padding:22px;color:#55dcff;
 font-size:25px;font-weight:bold;letter-spacing:5px}
main{max-width:850px;margin:auto;padding:15px}
.panel{
 background:#102333;border:1px solid #28536b;
 border-radius:16px;padding:18px;margin-bottom:15px
}
h3{color:#64dcff;font-size:14px;letter-spacing:2px}
button{
 background:#075574;color:white;border:1px solid #39caff;
 border-radius:9px;padding:13px 18px;margin:5px;
 cursor:pointer
}
button:disabled{opacity:.5}
canvas{width:100%;display:block;border-radius:10px}
input{accent-color:#40dfff;width:100%}
.status{font-size:12px;color:#8db4c8}
#intensity{
 height:14px;background:#06121b;border-radius:20px;
 overflow:hidden;margin-top:12px
}
#level{
 height:100%;width:0%;
 background:linear-gradient(90deg,#087cff,#00eaff,#ff2929);
 transition:width .05s
}
</style>
</head>
<body>
<header>VISION OS</header>
<main>
<section class="panel">
<h3>SOUND VISION</h3>
<canvas id="visual" width="1200" height="650"></canvas>
<h3>SOUND INTENSITY</h3>
<div id="intensity"><div id="level"></div></div>
<p id="db" class="status">Waiting for microphone...</p>
</section>

<section class="panel">
<h3>CONTROLS</h3>
<button id="start">ACTIVATE MICROPHONE</button>
<button id="stop">STOP</button>
<button id="vr">ENTER VR</button>
<p id="status" class="status">Microphone disabled.</p>

<h3>SENSITIVITY</h3>
<input id="sensitivity" type="range"
 min="0.5" max="4" step="0.1" value="2">
<p class="status">Adjusts visual brightness.</p>
</section>
</main>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.getElementById('visual');
const ctx=canvas.getContext('2d');

let audio=null;
let analyser=null;
let stream=null;
let frequencies=null;
let waveform=null;
let active=false;
let sensitivity=2;
let smoothedLevel=0;

const status=document.getElementById('status');
const levelBar=document.getElementById('level');
const dbText=document.getElementById('db');

document.getElementById('sensitivity').oninput=e=>{
 sensitivity=Number(e.target.value);
};

async function startAudio(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:false,
    noiseSuppression:false,
    autoGainControl:false
   }
  });

  audio=new AudioContext();
  await audio.resume();

  analyser=audio.createAnalyser();
  analyser.fftSize=4096;
  analyser.smoothingTimeConstant=0.65;

  const input=audio.createMediaStreamSource(stream);
  input.connect(analyser);

  frequencies=new Uint8Array(analyser.frequencyBinCount);
  waveform=new Uint8Array(analyser.fftSize);

  active=true;
  status.textContent='Microphone active.';
 }catch(error){
  status.textContent='Microphone error: '+error.message;
 }
}

function stopAudio(){
 active=false;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }

 if(audio){
  audio.close();
  audio=null;
 }

 analyser=null;
 status.textContent='Microphone disabled.';
}

document.getElementById('start').onclick=startAudio;
document.getElementById('stop').onclick=stopAudio;

function draw(){
 const w=canvas.width;
 const h=canvas.height;

 ctx.fillStyle='#02080e';
 ctx.fillRect(0,0,w,h);

 if(!active || !analyser){
  ctx.fillStyle='#65dfff';
  ctx.font='32px Arial';
  ctx.fillText('WAITING FOR AUDIO',390,320);
  requestAnimationFrame(draw);
  return;
 }

 analyser.getByteFrequencyData(frequencies);
 analyser.getByteTimeDomainData(waveform);

 // Overall audio intensity from RMS
 let sum=0;
 for(let i=0;i<waveform.length;i++){
  const v=(waveform[i]-128)/128;
  sum+=v*v;
 }
 const rms=Math.sqrt(sum/waveform.length);
 const intensity=Math.min(1,rms*5);

 smoothedLevel+=(intensity-smoothedLevel)*0.2;

 levelBar.style.width=(smoothedLevel*100)+'%';
 dbText.textContent='Relative sound intensity: '+
  Math.round(smoothedLevel*100)+'%';

 // Frequency visualization
 const columns=120;
 const colWidth=w/columns;

 for(let x=0;x<columns;x++){
  // Logarithmic frequency distribution
  const t=x/(columns-1);
  const start=Math.floor(Math.pow(t,2)*frequencies.length);
  const end=Math.max(start+1,
   Math.floor(Math.pow((x+1)/columns,2)*frequencies.length));

  let sum=0;
  for(let i=start;i<end;i++)sum+=frequencies[i];

  const amplitude=(sum/(end-start))/255;
  const brightness=Math.min(100,
   4+amplitude*85*sensitivity);

  // Low frequencies blue, high frequencies red
  const hue=220-t*220;

  ctx.fillStyle=`hsl(${hue},100%,${brightness}%)`;

  const barHeight=amplitude*h*.9;
  const y=(h-barHeight)/2;

  ctx.fillRect(x*colWidth,y,colWidth-2,barHeight);
 }

 // Central frequency reference
 ctx.strokeStyle='#ffffff22';
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(0,h/2);
 ctx.lineTo(w,h/2);
 ctx.stroke();

 requestAnimationFrame(draw);
}

draw();

/* WEBXR */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020812);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.01,100
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;

const texture=new THREE.CanvasTexture(canvas);

const screen=new THREE.Mesh(
 new THREE.PlaneGeometry(2.5,1.35),
 new THREE.MeshBasicMaterial({
  map:texture,
  side:THREE.DoubleSide
 })
);

screen.position.set(0,1.6,-2);
scene.add(screen);

const frame=new THREE.Mesh(
 new THREE.PlaneGeometry(2.57,1.42),
 new THREE.MeshBasicMaterial({
  color:0x087b9c,
  side:THREE.DoubleSide
 })
);

frame.position.set(0,1.6,-2.015);
scene.add(frame);
frame.add(screen);
screen.position.set(0,0,.012);

const grid=new THREE.GridHelper(
 30,30,0x164c66,0x102b3c
);
scene.add(grid);

document.body.appendChild(renderer.domElement);
renderer.domElement.style.display='none';

renderer.setAnimationLoop(()=>{
 texture.needsUpdate=true;
 renderer.render(scene,camera);
});

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('vr').onclick=async()=>{
 try{
  if(!navigator.xr){
   status.textContent='WebXR unavailable.';
   return;
  }

  const supported=await navigator.xr
   .isSessionSupported('immersive-vr');

  if(!supported){
   status.textContent='Immersive VR unavailable.';
   return;
  }

  const session=await navigator.xr.requestSession(
   'immersive-vr',
   {optionalFeatures:['local-floor']}
  );

  await renderer.xr.setSession(session);

  renderer.domElement.style.display='block';
  status.textContent='VR session active.';

  session.addEventListener('end',()=>{
   renderer.domElement.style.display='none';
   status.textContent='VR session ended.';
  });

 }catch(error){
  status.textContent='VR error: '+error.message;
 }
};
</script>
</body>
</html>
